name = "blog-ikber"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]

main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

services = [
  { binding = "WORKER_SELF_REFERENCE", service = "blog-ikber" },
]

[[d1_databases]]
binding = "DB"
database_name = "blog-db"
# database_id should be set via environment variable or CI/CD
# For local development, use: wrangler dev --local
database_id = "${DATABASE_ID}"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "blog-images"
